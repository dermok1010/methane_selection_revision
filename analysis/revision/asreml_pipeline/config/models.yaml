# Trait definitions and model sweep configuration.
#
# Fixed-effects formula, response-variable names and the VPREDICT
# structure below are all taken directly from the legacy .as files
# (analysis/legacy/asreml_scripts/a_uni_methane.as,
# bi_ch4_ch4ratio.as) and cross-checked against
# docs/asreml_legacy_map.md -- they are not re-derived assumptions.
# Every trait in this list shares the identical fixed-effects formula in
# the legacy dump (verified by grepping every a_uni_*.as model line);
# only the response variable changes.

phenotype_file: phenotype_asreml.csv   # produced by scripts/00_prepare_asreml_phenotype.R
pedigree_file: pedigree.csv.SRT        # ASReml-sorted copy of config/paths.yaml's pedigree_file, staged into run/

# ASReml's field-definition block is POSITIONAL: one line per column of
# the data file, IN ORDER (a field can only be omitted by using !SKIP
# before the next one, or by being at the very end of the line -- see
# ASReml-4.2-Functional-Specification.pdf Section 5.4). This list must
# therefore match phenotype_asreml.csv's actual column order exactly.
# 01_generate_models.R checks this against the file header at generation
# time and refuses to generate anything if they disagree, rather than
# silently emitting misaligned .as files. This list matches
# scripts/00_prepare_asreml_phenotype.R's column order exactly (which in
# turn reproduces legacy data_generation.R's, cross-checked against
# analysis/legacy/asreml_scripts/a_uni_methane.as's own field block).
# type: "1" (numeric/covariate), "A" (alphanumeric factor)
phenotype_columns:
  - {name: ANI_ID, type: "1"}   # also gets the !P pedigree-match flag, added separately
  - {name: ch4_g_day2_1v3, type: "1"}
  - {name: co2_g_day2_1v3, type: "1"}
  - {name: ch4_ratio, type: "1"}
  - {name: methane_per_dmi, type: "1"}
  - {name: methane_per_mbw, type: "1"}
  - {name: Metabolic_BW, type: "1"}
  - {name: SEX, type: "A"}
  - {name: TX, type: "1"}
  - {name: BR, type: "1"}
  - {name: SU, type: "1"}
  - {name: CL, type: "1"}
  - {name: CV, type: "1"}
  - {name: LY, type: "1"}
  - {name: UN, type: "1"}
  - {name: het, type: "1"}
  - {name: rec, type: "1"}
  - {name: age_in_years, type: "1"}
  - {name: ch4_GroupNumber, type: "A"}
  - {name: weight, type: "1"}
  - {name: DMI, type: "1"}
  - {name: adg, type: "1"}
  - {name: methane_per_adg, type: "1"}
  - {name: methane_per_rumen, type: "1"}
  - {name: methane_per_muscle, type: "1"}
  - {name: rumen, type: "1"}
  - {name: age_in_months, type: "1"}
  - {name: age_in_weeks, type: "1"}
  - {name: REARING_RANK, type: "1"}
  - {name: BIRTH_RANK, type: "1"}
  - {name: ewe_birth_rank, type: "1"}
  - {name: ewe_rearing_rank, type: "1"}
  - {name: dam_parity_group_num, type: "1"}
  - {name: ct_muscle_kg, type: "1"}
  - {name: methane_per_lw, type: "1"}
  - {name: ch4_adj_MBW, type: "1"}
  - {name: ch4_adj_MBW_co2, type: "1"}
  - {name: ch4_adj_DMI, type: "1"}
  - {name: ch4_adj_adg, type: "1"}
  - {name: adg_g, type: "1"}
  - {name: stage_660, type: "A"}   # growing(<660d)/mature split, see scripts/00_prepare_asreml_phenotype.R
  - {name: ch4_young, type: "1"}   # CH4, missing unless stage_660=="young"
  - {name: ch4_old, type: "1"}     # CH4, missing unless stage_660=="mature"
  - {name: cg_mean_cl, type: "A"}  # contemporary-group-mean tertile class, see scripts/00_prepare_asreml_phenotype.R
  - {name: ch4_ratio_mol, type: "1"}  # CH4 ratio, molar basis -- see scripts/00_prepare_asreml_phenotype.R

workspace_mb: 5000
maxit: 300
# ASReml defaults to using up to 16 OMP threads (!MP, manual Section 5.8)
# regardless of what Slurm actually allocated -- the legacy .as files
# never set !MP explicitly, so every legacy job silently over-subscribed
# whatever CPU allocation its Slurm script requested. ASReml is reported
# not to scale well with more threads anyway, so this is set low and
# must match slurm/asreml_job.slurm's --cpus-per-task.
mp_threads: 2

# Verbatim from every legacy a_uni_*.as / bi_*.as model line (Trait.-prefixed
# for bivariate models). Do not add/remove terms without updating
# docs/asreml_legacy_map.md Section 1's manuscript-model comparison --
# this list includes the undocumented `UN` breed term flagged there.
fixed_effects:
  - SEX
  - TX
  - BR
  - SU
  - CL
  - CV
  - LY
  - UN
  - het
  - rec
  - REARING_RANK
  - BIRTH_RANK
  - ewe_birth_rank
  - ewe_rearing_rank
  - age_in_weeks
  - dam_parity_group_num
  - ch4_GroupNumber

random_effects:
  univariate: "ped(ANI_ID) ide(ANI_ID)"
  # ide(ANI_ID) is deliberately NOT Trait.-prefixed here: the legacy
  # bivariate models fit a single shared (not trait-specific) permanent-
  # environment term -- confirmed from bi_ch4_ch4ratio.asr, where
  # ide(ANI_ID) reports one IDV_V value, not a 2x2 US block. This is a
  # real modelling choice in the submitted analysis, reproduced as-is,
  # not a simplification introduced here.
  bivariate: "Trait.ped(ANI_ID) ide(ANI_ID)"

# code: short filename token (matches legacy a_uni_<code>.as / bi_<codeA>_<codeB>.as)
# variable: column name in phenotype_file
# table2: whether this is one of the manuscript's 9 Table 2 traits
traits:
  - code: methane
    # Legacy filenames are inconsistent for this one trait: the
    # univariate job is a_uni_methane.as but every bivariate job uses
    # "ch4" (e.g. bi_ch4_ch4ratio.as), not "methane". legacy_bi_alias
    # lets the structure-block lookup in 01_generate_models.R find those
    # files; no other trait in this list has this inconsistency.
    legacy_bi_alias: ch4
    variable: ch4_g_day2_1v3
    label: "CH4 (g/day)"
    table2: true
  - code: ch4mbw
    variable: methane_per_mbw
    label: "MI (CH4/MBW)"
    table2: true
  - code: ch4ratio
    variable: ch4_ratio
    label: "CH4 ratio (CH4/(CH4+CO2))"
    table2: true
  - code: ch4adg
    variable: methane_per_adg
    label: "CH4/ADG"
    table2: true
  - code: ch4muscle
    variable: methane_per_muscle
    label: "CH4/MM"
    table2: true
  - code: ch4rumen
    variable: methane_per_rumen
    label: "CH4/rumen"
    table2: true
  - code: ch4rmtmbw
    variable: ch4_adj_MBW
    label: "RMTMBW (residual, MBW)"
    table2: true
  - code: ch4rmtmbwco2
    variable: ch4_adj_MBW_co2
    label: "RMTMBW+CO2 (residual, MBW+CO2)"
    table2: true
  - code: ch4rmtadg
    variable: ch4_adj_adg
    label: "RMTADG (residual, ADG)"
    table2: true
  - code: ch4lw
    variable: methane_per_lw
    label: "CH4/LW (not in Table 2 -- selection-index input, see docs/asreml_legacy_map.md Section 1)"
    table2: false
  - code: ch4ratiomol
    variable: ch4_ratio_mol
    label: "CH4 ratio, molar basis (mol CH4/(mol CH4+mol CO2)) -- not in Table 2, a 2026-09-21 robustness check on the mass-basis ch4_ratio trait, see scripts/00_prepare_asreml_phenotype.R"
    table2: false

# The small set to run and validate FIRST, against known legacy results
# (docs/asreml_legacy_map.md Section 6/7): CH4 and CH4 ratio univariate
# (anchors Table 2's most literature-contested row), plus their bivariate
# pair (fully worked/decoded example -- exact VPREDICT index provenance
# documented in scripts/01_generate_models.R).
validation_set:
  univariate: [methane, ch4ratio]
  bivariate:
    - [methane, ch4ratio]

# ---- CH4 ratio on a molar basis (2026-09-21, per user request) --------
#
# ch4_ratio_mol (mol CH4/(mol CH4+mol CO2), see
# scripts/00_prepare_asreml_phenotype.R) is a robustness check on
# whether the manuscript's mass-basis ch4_ratio heritability/
# repeatability is sensitive to the unit basis Reviewer 1 flags as never
# stated. Univariate model gets ch4_ratio_mol's own h2/t; the bivariate
# pair against the existing ch4_ratio gets their genetic correlation
# (are the two bases measuring the same genetic signal just rescaled, or
# something different?). Uses independent PE if ch4ratiomol already has
# a CONVERGED univariate estimate on file (via choose_pe_term() in
# 01_generate_models.R), else falls back to shared PE with a note --
# same discipline as --set=full/components, not a new mechanism.
mol_ratio_set:
  univariate: [ch4ratiomol]
  bivariate:
    - [ch4ratio, ch4ratiomol]

# Once the validation set matches legacy results, generate_all_pairs
# produces the full submitted-style sweep: all 10 univariate models, plus
# every pairwise bivariate combination among them (45 pairs) -- a
# near-complete sweep, matching the legacy dump's own coverage per
# docs/asreml_legacy_map.md Section 1. No pairs are excluded by default;
# add trait codes to `exclude_pairs` (as [a, b] entries) to skip specific
# combinations later without editing the generator itself.
#
# SUPERSEDED as the production target (2026-09-20, user scope decision):
# the paper needs the pairs that actually support its arguments, not an
# indiscriminate matrix. Kept here, not deleted, since the config/data
# is real and some of these 52 pairs are still useful cross-checks -- but
# --set=key_bivariates (below) is what to run/finalize going forward.
full_sweep:
  generate_all_pairs: true
  exclude_pairs: []

# Raw denominator/component variables behind each ratio trait above --
# kept separate from `traits:` (not part of the Table 2 sweep, and NOT
# included in full_sweep's generate_all_pairs) so this addition can't
# silently change what --set=full generates. Used only via --set=components,
# to get each component's own genetic variance and its genetic covariance
# with CH4, from which scripts/04_derive_ratio_from_components.R derives
# each ratio trait's h2/rg by the first-order Taylor linearisation of a
# ratio -- the same delta-method gradient already used for real in the
# upstream Methane_Selection_Index_Analysis repo (index_weight_methane.R /
# MC_weight.R, commit fb1f0a2cddb82ba322cfd86b4ad3d99830385a44), extended
# from "selection response" to "heritability/genetic correlation" (same
# quadratic form a'Ga, a'Pa -- not a new derivation).
# Component codes match analysis/legacy/asreml_scripts/ filename codes
# exactly wherever a legacy pair exists (bi_ch4_mbw.as, bi_ch4_muscle.as,
# bi_ch4_weight.as), so 01_generate_models.R's legacy-starting-value
# lookup (matching on `bi_<code1>_<code2>.as`) finds them automatically --
# not just cosmetic naming. No legacy bi_ch4_co2.as, bi_ch4_rumen.as, or
# bi_ch4_adg.as exists (adg's only legacy bivariate partner is adg_g,
# a grams-rescaled variant -- not reused here since methane_per_adg is
# constructed from the kg/day `adg` column, not `adg_g`; see
# 00_prepare_asreml_phenotype.R), so those three fall back to ASReml
# auto-initialisation, same as any other never-before-fit pair.
component_traits:
  - code: co2
    variable: co2_g_day2_1v3
    label: "CO2 (g/day) -- component of CH4 ratio = CH4/(CH4+CO2)"
  - code: mbw
    variable: Metabolic_BW
    label: "Metabolic BW -- component of CH4/MBW"
  - code: adg
    variable: adg
    label: "ADG -- component of CH4/ADG"
  - code: muscle
    variable: ct_muscle_kg
    label: "CT muscle (kg) -- component of CH4/MM"
  - code: rumen
    variable: rumen
    label: "Rumen -- component of CH4/rumen"
  - code: weight
    variable: weight
    label: "Liveweight -- component of CH4/LW"

# Scope correction (2026-09-15, user): this is NOT a selection-index or
# complete-covariance-structure exercise. The sole purpose is deriving
# each composite methane trait's heritability from its own underlying
# components' (co)variances -- so only the bivariate pairs a composite
# trait actually needs are generated, not all choose(7,2)=21. Pairwise
# correlations among derived traits and any multivariate/selection-index
# work are explicitly deferred to a later, separate task.
#
# Composite trait -> components required:
#   MI (CH4/MBW), RMTMBW        -> CH4, MBW
#   CH4 ratio                   -> CH4, CO2
#   CH4/ADG, RMTADG             -> CH4, ADG
#   CH4/MM                      -> CH4, muscle
#   CH4/rumen                   -> CH4, rumen
#   CH4/LW                      -> CH4, weight (liveweight)
#   RMTMBW+CO2                  -> CH4, MBW, CO2 (three components ->
#                                  needs CH4-MBW, CH4-CO2 AND MBW-CO2)
# -> 7 bivariate pairs total: the 6 "CH4 vs X" pairs plus mbw-co2 (the
# only pair not involving CH4, needed solely for RMTMBW+CO2's 3x3 block).
# Of these, 2 have real legacy starting values (methane-mbw, methane-muscle;
# methane-weight also has one but LW/CH4LW isn't used by RMTMBW+CO2 --
# listed anyway since CH4/LW still needs it); methane-co2, methane-adg,
# methane-rumen, and mbw-co2 have no legacy counterpart.
component_set:
  univariate: [methane, co2, mbw, adg, muscle, rumen, weight]
  bivariate:
    - [methane, mbw]
    - [methane, co2]
    - [methane, adg]
    - [methane, muscle]
    - [methane, rumen]
    - [methane, weight]
    - [mbw, co2]

# Small trial before the full set (all 7 univariate models are cheap and
# always run first regardless). methane-mbw (legacy-backed, low risk);
# mbw-co2 (no legacy, the one new pair this design actually needed
# beyond the original "CH4 vs each" star, and the only pair not
# involving CH4); methane-rumen (no legacy, and rumen has only 780
# records at 3.2% repeat rate -- tests whether the shared PE term is
# identifiable at all for a near-single-record trait).
component_trial_set:
  univariate: [methane, co2, mbw, adg, muscle, rumen, weight]
  bivariate:
    - [methane, mbw]
    - [mbw, co2]
    - [methane, rumen]

# ---- Reviewer-1 contemporary-group/scale-heterogeneity concern, and the
# young-vs-mature bivariate genetic correlation (2026-09-18, per user
# instruction) -----------------------------------------------------------

# --set=stage_het: refits each listed trait's univariate model with
# `residual sat(stage_660).idv(units)` (heterogeneous residual variance
# between the manuscript's own growing/mature <660-day split) instead of a
# single pooled residual variance. Generalizes, into the main pipeline,
# the single-trait pilot already run and CONVERGED in
# analysis/diagnostics/reviewer_a2_a3/a_ch4_stage_het_residual.as (which
# found a real, non-trivial effect for CH4: residual variance differs 2.4x
# between stages) to every Table 2 trait. ch4lw is excluded -- it isn't a
# Table 2 trait (see the `traits:` list's `table2` flags above).
stage_het_traits:
  [methane, ch4mbw, ch4ratio, ch4adg, ch4muscle, ch4rumen, ch4rmtmbw,
   ch4rmtmbwco2, ch4rmtadg]

# --set=young_old: a young(<660d)-vs-mature bivariate genetic correlation
# for CH4 itself, treating the same measured trait in the two age classes
# as two correlated pseudo-traits (classic across-environment genetic-
# correlation design) -- answers the scope decision explicitly left open
# in analysis/diagnostics/reviewer_a2_a3/README.md's A3 section ("a
# young-vs-mature bivariate genetic analysis"). variable1/variable2 are
# ch4_young/ch4_old from scripts/00_prepare_asreml_phenotype.R (CH4,
# missing outside that record's own stage).
young_old_pair:
  variable1: ch4_young
  variable2: ch4_old
  label1: "CH4, young (<660 days)"
  label2: "CH4, mature (>=660 days)"

# --set=cg_het: refits each listed trait's univariate model with
# `residual sat(cg_mean_cl).idv(units)` -- heterogeneous residual variance
# across contemporary-group-mean tertile classes (cg_mean_cl, up to 41
# classes: each ch4_GroupNumber's own mean CH4, tertile-binned within its
# data source), computed in scripts/00_prepare_asreml_phenotype.R and
# adapted directly from a real prior ASReml/MiX99 analysis the user had
# already built for a related project
# (~/Dermot_analysis/Phd/Paper_3/2_genetic_analysis/scripts/
# CG_variance_adjust.R). This is a more direct answer to Reviewer 1's
# contemporary-group-heteroscedasticity concern than stage_het's age-
# based proxy above -- literally fitting one residual variance per
# ch4_GroupNumber (1435 levels) is intractable, but binning CGs by their
# own mean is tractable and targets the concern (scale differences
# between contemporary groups) directly rather than via an age surrogate.
# Same trait set as stage_het_traits for consistency.
cg_het_traits:
  [methane, ch4mbw, ch4ratio, ch4adg, ch4muscle, ch4rumen, ch4rmtmbw,
   ch4rmtmbwco2, ch4rmtadg]

# ---- Curated bivariate matrix (2026-09-20, user scope decision) --------
#
# Supersedes --set=full's indiscriminate 52-pair sweep as the production
# target. User's own framing: run/finalize only the bivariates that
# actually support the revised paper, not a complete pairwise matrix.
# Three purposes, three sub-lists below (all independent-PE, via the same
# choose_pe_term() mechanism as --set=full/components):
#
#   1. alt_vs_ch4:    each of the 8 non-CH4 Table 2 definitions vs daily
#      CH4 itself -- the paper's own headline comparison for every
#      alternative methane trait.
#   2. vs_components: daily CH4 vs the biologically relevant component
#      traits each definition is built from (LW, MBW, CO2, ADG, muscle,
#      rumen), plus mbw-co2 for the 3-way RMTMBW+CO2 block. This is
#      IDENTICAL to component_set$bivariate above (not duplicated data,
#      just reused for this purpose too) -- LW/weight is included even
#      though CH4/LW itself isn't a Table 2 trait (user's explicit call,
#      2026-09-20 AskUserQuestion: keep it for consistency, it's already
#      generated and cheap).
#   3. ratio_vs_denominator: each residual/ratio trait vs its own
#      denominator/adjustment variable(s) -- answers "what does this
#      phenotype actually represent" directly, distinct from (2)'s
#      component-based h2-derivation purpose. RMTMBW+CO2 needs both of
#      its adjustment variables (mbw AND co2).
#
# --set=key_bivariates generates all of these as one flat list (23 pairs
# total, vs. --set=full's 52) using the same independent-PE, discovery-
# only mechanism as --set=full/components -- see choose_pe_term() in
# 01_generate_models.R.
key_bivariates_alt_vs_ch4:
  - [methane, ch4mbw]
  - [methane, ch4ratio]
  - [methane, ch4adg]
  - [methane, ch4muscle]
  - [methane, ch4rumen]
  - [methane, ch4rmtmbw]
  - [methane, ch4rmtmbwco2]
  - [methane, ch4rmtadg]
key_bivariates_ratio_vs_denominator:
  - [ch4ratio, co2]
  - [ch4rmtmbw, mbw]
  - [ch4rmtmbwco2, mbw]
  - [ch4rmtmbwco2, co2]
  - [ch4rmtadg, adg]
  - [ch4adg, adg]
  - [ch4muscle, muscle]
  - [ch4rumen, rumen]
# key_bivariates_vs_components intentionally omitted as its own list --
# --set=key_bivariates reuses component_set$bivariate directly (see
# 01_generate_models.R) so there is exactly one source of truth for
# those 7 pairs, not two lists that could drift apart.

# ---- CG-heterogeneous bivariate follow-up, generalized (2026-09-20) ----
#
# Per user: "where the univariate work says heterogeneity matters, try
# the corresponding heterogeneous bivariate model as well." "Matters" =
# one of the 5 Table 2 traits whose --set=cg_het univariate model
# CONVERGED and showed a real variance-partitioning shift (methane,
# ch4mbw, ch4ratio, ch4rmtmbw, ch4rmtmbwco2) -- the other 4 (ch4adg,
# ch4muscle, ch4rumen, ch4rmtadg) are not estimable under this residual
# structure at all (AI-matrix singularity, see cg_het_traits comment
# above), so no heterogeneous bivariate variant is generated for pairs
# that only involve them. Filtered from key_bivariates_* above: every
# pair below has at least one trait in that 5-trait "matters" set; raw
# component traits (mbw, co2, adg, muscle, rumen, weight) were never
# themselves tested for residual heterogeneity, so a pair between two
# non-Table-2 traits (mbw_co2) is excluded even though it's in
# component_set.
#
# IMPORTANT -- do NOT submit these to HPC before bi_methane_ch4mbw_cg_het_trial
# (the single bounded prototype, --set=bi_cg_het_trial) has actually
# CONVERGED and been checked for a stable, sensible fit. That trial is
# generated but not yet run as of 2026-09-20 -- these 18 pairs are the
# same parameter-rich sat(cg_mean_cl).us(Trait).units stress-test
# structure (~90 residual parameters each), and the project's own
# established discipline (analysis/revision/asreml_pipeline/README.md)
# is explicit: do not launch a heterogeneous bivariate sweep until the
# prototype confirms the structure is estimable and worth the ASReml
# license cost. --set=key_bivariates_cg_het generates the .as files
# (cheap, local, no ASReml needed) so they're ready the moment the
# trial gives the go-ahead -- it does not imply they should be
# submitted immediately.
key_bivariates_cg_het:
  - [methane, ch4mbw]
  - [methane, ch4ratio]
  - [methane, ch4adg]
  - [methane, ch4muscle]
  - [methane, ch4rumen]
  - [methane, ch4rmtmbw]
  - [methane, ch4rmtmbwco2]
  - [methane, ch4rmtadg]
  - [methane, mbw]
  - [methane, co2]
  - [methane, adg]
  - [methane, muscle]
  - [methane, rumen]
  - [methane, weight]
  - [ch4ratio, co2]
  - [ch4rmtmbw, mbw]
  - [ch4rmtmbwco2, mbw]
  - [ch4rmtmbwco2, co2]

# ---- CG-heterogeneous-SCALE bivariate matrix (2026-09-20 follow-up) ----
#
# key_bivariates_cg_het's sat(cg_mean_cl).us(Trait).units structure
# failed on HPC (bi_methane_ch4mbw_cg_het_trial: "Variance structure does
# not match data" -- several cg_mean_cl classes have as few as 4 records,
# too few to identify a full per-class 2x2 covariance matrix). The
# replacement structure, idh(cg_mean_cl).us(Trait).units (per-class
# residual SCALE only, one correlation SHARED across all classes -- see
# 01_generate_models.R's gen_bivariate_cg_het_scale_trial comment for the
# ASReml-manual justification), needs far less data per class, but is
# still worth testing on a narrower list than key_bivariates_cg_het's 18
# pairs: per user instruction (2026-09-20), drop any pair whose
# non-"matters" partner is one of the 4 traits already confirmed
# NON-estimable under univariate cg_het (ch4adg, ch4muscle, ch4rumen,
# ch4rmtadg) -- pairing them bivariately is very unlikely to succeed
# either, for the identical underlying reason (their own univariate
# cg_het fits hit the same AI-matrix singularity). Drops
# methane_ch4adg, methane_ch4muscle, methane_ch4rumen, methane_ch4rmtadg,
# and ch4ratio_co2 (neither trait is in the confirmed "matters" set --
# ch4ratio's cg_het status is still ambiguous, not confirmed either way)
# from the 18 -- 13 pairs.
key_bivariates_cg_het_scale:
  - [methane, ch4mbw]
  - [methane, ch4ratio]
  - [methane, ch4rmtmbw]
  - [methane, ch4rmtmbwco2]
  - [methane, mbw]
  - [methane, co2]
  - [methane, adg]
  - [methane, muscle]
  - [methane, rumen]
  - [methane, weight]
  - [ch4rmtmbw, mbw]
  - [ch4rmtmbwco2, mbw]
  - [ch4rmtmbwco2, co2]
